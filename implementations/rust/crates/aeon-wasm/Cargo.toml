[package]
name = "aeon-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser-friendly WebAssembly wrapper for the Rust AEON implementation."

[dependencies]
aes-telex.workspace = true
aeon-annotations.workspace = true
aeon-canonical.workspace = true
aeon-core.workspace = true
aeon-finalize.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
