[package]
name = "altopelago-aeon-finalize"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed and JSON materialization for compiled AltoPelago AEON documents."
readme = "README.md"
keywords = ["aeon", "deserialization", "configuration", "serialization"]
categories = ["config", "encoding"]

[dependencies]
aes-telex.workspace = true
aeon-core.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }

[lib]
name = "aeon_finalize"
path = "src/lib.rs"

[lints]
workspace = true
