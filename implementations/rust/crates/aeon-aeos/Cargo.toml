[package]
name = "altopelago-aeon-aeos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AEOS schema validation for AltoPelago AEON and AES event streams."
readme = "README.md"
keywords = ["aeon", "schema", "validation", "serialization"]
categories = ["config", "parser-implementations"]

[dependencies]
aes-telex.workspace = true
aeon-core.workspace = true
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.150"

[lib]
name = "aeon_aeos"
path = "src/lib.rs"

[lints]
workspace = true
