[package]
name = "altopelago-aeon-document"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Immutable, capability-aware document graph for AEON."
readme = "README.md"
keywords = ["aeon", "document", "configuration", "serialization"]
categories = ["config", "data-structures"]
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
aeon-core.workspace = true
aes-telex.workspace = true

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[lib]
name = "aeon_document"
path = "src/lib.rs"

[lints]
workspace = true
