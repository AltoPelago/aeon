[workspace]
members = [
    "crates/aeon-sdk",
    "crates/aeon-aeos",
    "crates/aeon-annotations",
    "crates/aeon-canonical",
    "crates/aeon-cli",
    "crates/aeon-core",
    "crates/aeon-document",
    "crates/aeon-finalize",
    "crates/aeon-python",
    "crates/aeon-wasm",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/AltoPelago/aeon"
rust-version = "1.93.1"
version = "0.17.0-rc.2"

[workspace.dependencies]
# Verified registry provider; see docs/releases/aes-0.3.2-rc.1.json.
aes-telex = { package = "altopelago-aes-telex", version = "=0.3.2-rc.1" }
aeon-sdk = { package = "altopelago-aeon", path = "crates/aeon-sdk", version = "0.17.0-rc.2" }
aeon-aeos = { package = "altopelago-aeon-aeos", path = "crates/aeon-aeos", version = "0.17.0-rc.2" }
aeon-annotations = { path = "crates/aeon-annotations", version = "0.17.0-rc.2" }
aeon-canonical = { path = "crates/aeon-canonical", version = "0.17.0-rc.2" }
aeon-cli = { path = "crates/aeon-cli", version = "0.17.0-rc.2" }
aeon-core = { package = "altopelago-aeon-core", path = "crates/aeon-core", version = "0.17.0-rc.2" }
aeon-document = { package = "altopelago-aeon-document", path = "crates/aeon-document", version = "0.17.0-rc.2" }
aeon-finalize = { package = "altopelago-aeon-finalize", path = "crates/aeon-finalize", version = "0.17.0-rc.2" }
aeon-wasm = { path = "crates/aeon-wasm", version = "0.17.0-rc.2" }
# Verified registry RC provider; see docs/releases/sansa-0.15.0-rc.2.json.
sansa-runtime = { package = "altopelago-sansa-runtime", version = "=0.15.0-rc.2" }
sha2 = "0.11.0"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
