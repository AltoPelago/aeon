name: Dependency Security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1

  typescript-dependency-integrity:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Enforce TypeScript lockfile updates
        run: bash ./scripts/check-typescript-lockfile.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.4

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: implementations/typescript/pnpm-lock.yaml

      - name: Reject install-time lifecycle scripts
        run: node ./scripts/check-typescript-lifecycle-scripts.mjs

      - name: Dependency install integrity check
        working-directory: implementations/typescript
        run: pnpm install --frozen-lockfile --ignore-scripts

  rust-advisory-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout AES
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AltoPelago/aes
          ref: 84efced0d5a6e5fee50ebc69e04a861e2f567641
          path: aes

      - name: Link AES beside the AEON checkout
        run: ln -s "$GITHUB_WORKSPACE/aes" "$GITHUB_WORKSPACE/../aes"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.93.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run RustSec advisory scan
        working-directory: implementations/rust
        run: cargo audit

      - name: Install cargo-deny
        # 0.22 requires Rust 1.95; keep this policy tool compatible with the pinned toolchain.
        run: cargo install cargo-deny --version 0.21.0 --locked

      - name: Run cargo-deny policy checks
        working-directory: implementations/rust
        run: cargo deny check
