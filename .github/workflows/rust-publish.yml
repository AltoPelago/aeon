name: Rust Publish

on:
  push:
    tags:
      - "rust/v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify and package crates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout AES
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AltoPelago/aes
          ref: e9eb812d55cc69c5036c999c8bd2ea2585628666
          path: aes

      - name: Link AES beside AEON checkout
        run: ln -s "${GITHUB_WORKSPACE}/aes" "${GITHUB_WORKSPACE}/../aes"

      - name: Require signed annotated release tag
        if: ${{ github.event_name == 'push' }}
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "${GITHUB_REF_NAME}")" = "tag"
          git cat-file tag "${GITHUB_REF_NAME}" | grep -Eq '^-+BEGIN (PGP|SSH) SIGNATURE-+$'

      - name: Verify tag commit is on main
        if: ${{ github.event_name == 'push' }}
        run: |
          TAG_COMMIT="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main

      - name: Verify release tag is signed
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          tag_type="$(printf '%s' "$tag_ref" | jq -r '.object.type')"
          tag_sha="$(printf '%s' "$tag_ref" | jq -r '.object.sha')"
          test "$tag_type" = "tag"
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.verification.verified' | grep -qx true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.93.1

      - name: Check version consistency
        run: npm run version:check

      - name: Match tag to Rust version
        if: ${{ github.event_name == 'push' }}
        run: npm run version:check-tag -- rust "${GITHUB_REF_NAME}"

      - name: Test facade with and without SANSA
        run: |
          cargo test --locked -p altopelago-aeon --no-default-features --manifest-path implementations/rust/Cargo.toml
          cargo test --locked -p altopelago-aeon --all-features --manifest-path implementations/rust/Cargo.toml

      - name: Package public crates without registry resolution
        run: |
          cargo package --locked --no-verify --manifest-path implementations/rust/crates/aeon-core/Cargo.toml
          cargo package --locked --no-verify \
            --manifest-path implementations/rust/crates/aeon-document/Cargo.toml \
            --config 'patch.crates-io.altopelago-aeon-core.path="implementations/rust/crates/aeon-core"'
          cargo package --locked --no-verify \
            --manifest-path implementations/rust/crates/aeon-aeos/Cargo.toml \
            --config 'patch.crates-io.altopelago-aeon-core.path="implementations/rust/crates/aeon-core"'
          cargo package --locked --no-verify \
            --manifest-path implementations/rust/crates/aeon-finalize/Cargo.toml \
            --config 'patch.crates-io.altopelago-aeon-core.path="implementations/rust/crates/aeon-core"'
          cargo package --locked --no-verify \
            --manifest-path implementations/rust/crates/aeon-sdk/Cargo.toml \
            --config 'patch.crates-io.altopelago-aeon-core.path="implementations/rust/crates/aeon-core"' \
            --config 'patch.crates-io.altopelago-aeon-aeos.path="implementations/rust/crates/aeon-aeos"' \
            --config 'patch.crates-io.altopelago-aeon-document.path="implementations/rust/crates/aeon-document"' \
            --config 'patch.crates-io.altopelago-aeon-finalize.path="implementations/rust/crates/aeon-finalize"'

  publish:
    name: Publish crates.io packages
    if: ${{ github.event_name == 'push' }}
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: crates-io
      url: https://crates.io/crates/altopelago-aeon
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout AES
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AltoPelago/aes
          ref: e9eb812d55cc69c5036c999c8bd2ea2585628666
          path: aes

      - name: Link AES beside AEON checkout
        run: ln -s "${GITHUB_WORKSPACE}/aes" "${GITHUB_WORKSPACE}/../aes"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.93.1

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@9c067fc5d5c254b33978fed918cb50c032549d0e # main

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#rust/v}"
          wait_for_crate() {
            crate="$1"
            for attempt in $(seq 1 12); do
              if cargo info "${crate}@${VERSION}" >/dev/null 2>&1; then
                return 0
              fi
              if [ "$attempt" -eq 12 ]; then
                return 1
              fi
              sleep 10
            done
          }

          cargo publish --locked --manifest-path implementations/rust/crates/aeon-core/Cargo.toml
          wait_for_crate altopelago-aeon-core
          cargo publish --locked --manifest-path implementations/rust/crates/aeon-document/Cargo.toml
          cargo publish --locked --manifest-path implementations/rust/crates/aeon-aeos/Cargo.toml
          cargo publish --locked --manifest-path implementations/rust/crates/aeon-finalize/Cargo.toml
          wait_for_crate altopelago-aeon-document
          wait_for_crate altopelago-aeon-aeos
          wait_for_crate altopelago-aeon-finalize
          cargo publish --locked --manifest-path implementations/rust/crates/aeon-sdk/Cargo.toml

  published-smoke:
    name: Clean crates.io consumer
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.93.1

      - name: Install and exercise exact published version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#rust/v}"
          cargo new --bin aeon-registry-smoke
          cd aeon-registry-smoke
          cat >> Cargo.toml <<EOF
          altopelago-aeon = { version = "=${VERSION}", features = ["sansa"] }
          EOF
          cat > src/main.rs <<'EOF'
          use altopelago_aeon::sansa_document::{
              AeonNumericMaterialization, AeonSansaNamespace, AeonSansaScope, CompileOptions,
              runtime::evaluate::EvaluateOptions,
          };
          use altopelago_aeon::{CompileToTelexOptions, aeon_to_telex};

          fn main() {
              let result = aeon_to_telex(
                  "greeting:string = \"Hello\"\n",
                  CompileToTelexOptions::default(),
              );
              assert!(result.compile.errors.is_empty());
              assert!(result.telex.is_some());

              let namespace = AeonSansaNamespace::compile(
                  "items = [{ sku = \"A-100\", qty = 2 }]",
                  CompileOptions::default(),
                  AeonSansaScope::Payload,
                  AeonNumericMaterialization::Lossless,
              )
              .expect("compile SANSA namespace");
              let query = namespace.evaluate_query(
                  "from $.items.*\nwhere .qty >= 2\nselect .sku",
                  &EvaluateOptions::default(),
              );
              assert!(query.is_ok());
              assert_eq!(query.results.len(), 1);
          }
          EOF
          for attempt in $(seq 1 12); do
            if cargo fetch; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            sleep 10
          done
          cargo run --release
