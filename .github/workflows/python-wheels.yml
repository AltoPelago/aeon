name: Python Wheels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: ${{ matrix.platform.name }} / CPython ${{ matrix.python }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        platform:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            manylinux: "off"
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"
          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: "off"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout AES
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AltoPelago/aes
          ref: 84efced0d5a6e5fee50ebc69e04a861e2f567641
          path: aes

      - name: Link AES beside AEON checkout
        if: runner.os != 'Windows'
        run: ln -s "${GITHUB_WORKSPACE}/aes" "${GITHUB_WORKSPACE}/../aes"

      - name: Link AES beside AEON checkout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          New-Item -ItemType Junction
          -Path (Join-Path $env:GITHUB_WORKSPACE '../aes')
          -Target (Join-Path $env:GITHUB_WORKSPACE 'aes')

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.14.1
          rust-toolchain: 1.93.1
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          # manylinux only mounts github.workspace; Cargo resolves AES beside it.
          docker-options: >-
            -v ${{ github.workspace }}/aes:${{ github.workspace }}/../aes:ro
          working-directory: implementations/rust/crates/aeon-python
          args: >-
            --release
            --locked
            --compatibility pypi
            --interpreter python${{ matrix.python }}
            --out wheelhouse

      - name: Resolve and install binary-only package
        run: >-
          python -m pip install
          --force-reinstall
          --no-index
          --only-binary=:all:
          --find-links implementations/rust/crates/aeon-python/wheelhouse
          altopelago-aeon==0.16.0

      - name: Installed-wheel smoke suite
        run: python -m unittest discover -s implementations/rust/crates/aeon-python/tests -p "test_*.py"

      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aeon-python-${{ matrix.platform.name }}-cp${{ matrix.python }}
          path: implementations/rust/crates/aeon-python/wheelhouse/*.whl
          if-no-files-found: error

  installed-conformance:
    name: Installed wheel / Core CTS differential
    needs: build-and-smoke
    runs-on: ubuntu-24.04
    env:
      AEONITE_CTS_ROOT: ${{ github.workspace }}/aeonite-cts/cts

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout aeonite-cts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeonite-org/aeonite-cts
          ref: 3af0471d627fa91d6b88d079ec1294acbf337315
          path: aeonite-cts

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Download CPython 3.12 wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aeon-python-linux-x86_64-cp3.12
          path: wheelhouse

      - name: Install wheel artifact
        run: >-
          python -c "import glob, subprocess, sys;
          wheels = glob.glob('wheelhouse/*.whl');
          assert len(wheels) == 1, wheels;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', wheels[0]])"

      - name: Installed-wheel typing contract
        run: |
          python -m pip install mypy==1.19.1
          python -m mypy --strict implementations/rust/crates/aeon-python/tests/typing/mutation.py

      - name: Installed-wheel Core CTS and pure-Python differential
        run: >-
          python scripts/check-installed-python-differential.py
          --cts aeonite-cts/cts/core/v1/core-cts.v1.snapshot-0.5.json
