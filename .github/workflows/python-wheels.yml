name: Python Wheels

on:
  push:
    branches:
      - rust/project-sofia
    paths:
      - .github/workflows/python-wheels.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: ${{ matrix.platform.name }} / CPython ${{ matrix.python }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        platform:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            manylinux: "off"
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"
          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: "off"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        uses: PyO3/maturin-action@12dee64e4a21f3a4a4fd4d34e05cc55f0eda098a # v1.49.4
        with:
          command: build
          maturin-version: v1.14.1
          rust-toolchain: 1.93.1
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          working-directory: implementations/rust/crates/aeon-python
          args: >-
            --release
            --locked
            --compatibility pypi
            --interpreter python${{ matrix.python }}
            --out wheelhouse

      - name: Install built wheel
        run: >-
          python -c "import glob, subprocess, sys;
          wheels = glob.glob('implementations/rust/crates/aeon-python/wheelhouse/*.whl');
          assert len(wheels) == 1, wheels;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', wheels[0]])"

      - name: Installed-wheel smoke suite
        run: python -m unittest discover -s implementations/rust/crates/aeon-python/tests -p "test_*.py"

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aeon-python-${{ matrix.platform.name }}-cp${{ matrix.python }}
          path: implementations/rust/crates/aeon-python/wheelhouse/*.whl
          if-no-files-found: error
