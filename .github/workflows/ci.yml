name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    defaults:
      run:
        working-directory: implementations/typescript

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: implementations/typescript/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Dependency graph checks
        run: pnpm depcheck

      - name: Unit tests
        run: pnpm -r --filter './packages/**' --filter './tools/**' --filter '!@altopelago/aeon-phase-fuzz' test

      - name: Phase fuzz (CI)
        run: pnpm test:fuzz

      - name: Stress tests
        run: pnpm test:stress

      - name: Checkout aeonite-cts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeonite-org/aeonite-cts
          path: aeonite-cts

      - name: CTS claim validation
        working-directory: .
        env:
          AEONITE_CTS_ROOT: ${{ github.workspace }}/aeonite-cts/cts
        run: npm run validate:cts-claims

      - name: CTS conformance (all lanes)
        env:
          AEONITE_CTS_ROOT: ${{ github.workspace }}/aeonite-cts/cts
        run: pnpm test:cts:all

  canonical-cts:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: implementations/typescript/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.93.1

      - name: Install TypeScript workspace dependencies
        working-directory: implementations/typescript
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build TypeScript workspace
        working-directory: implementations/typescript
        run: pnpm build

      - name: Build Rust CLI
        working-directory: implementations/rust
        run: cargo build -p aeon-cli

      - name: Canonical CTS lane
        run: bash ./scripts/canonical-cts.sh --mode all --brief
