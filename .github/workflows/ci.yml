name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    defaults:
      run:
        working-directory: implementations/typescript

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 8.14.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: implementations/typescript/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Dependency graph checks
        run: pnpm depcheck

      - name: Unit tests
        run: pnpm -r --filter './packages/**' --filter './tools/**' --filter '!@altopelago/aeon-phase-fuzz' test

      - name: Phase fuzz (CI)
        run: pnpm test:fuzz

      - name: Stress tests
        run: pnpm test:stress

      - name: Checkout aeonite-cts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: aeonite-org/aeonite-cts
          path: aeonite-cts

      - name: CTS conformance (all lanes)
        env:
          AEONITE_CTS_ROOT: ${{ github.workspace }}/aeonite-cts/cts
        run: pnpm test:cts:all

  canonical-cts:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 8.14.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: implementations/typescript/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: 1.93.1

      - name: Install TypeScript workspace dependencies
        working-directory: implementations/typescript
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build TypeScript workspace
        working-directory: implementations/typescript
        run: pnpm build

      - name: Build Rust CLI
        working-directory: implementations/rust
        run: cargo build -p aeon-cli

      - name: Canonical CTS lane
        run: bash ./scripts/canonical-cts.sh --mode all --brief
