name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    defaults:
      run:
        working-directory: implementations/typescript

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout AES
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AltoPelago/aes
          ref: 84efced0d5a6e5fee50ebc69e04a861e2f567641
          path: aes

      - name: Link AES for the Rust workspace
        run: ln -s "${GITHUB_WORKSPACE}/aes" "${GITHUB_WORKSPACE}/../aes"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.4

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: implementations/typescript/pnpm-lock.yaml

      - name: Version-tool tests
        working-directory: .
        run: npm run test:version

      - name: Release-workflow retry tests
        working-directory: .
        run: npm run test:release-workflows

      - name: Version consistency
        working-directory: .
        run: npm run version:check

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Dependency graph checks
        run: pnpm depcheck

      - name: Unit tests
        run: pnpm -r --filter './packages/**' --filter './tools/**' --filter '!@altopelago/aeon-phase-fuzz' test

      - name: Phase fuzz (CI)
        run: pnpm test:fuzz

      - name: Stress tests
        run: pnpm test:stress

      - name: Checkout aeonite-cts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeonite-org/aeonite-cts
          ref: 3dcbcb7611657af8d3af83e93c4d12568a3f0ce1
          path: aeonite-cts

      - name: CTS claim validation
        working-directory: .
        env:
          AEONITE_CTS_ROOT: ${{ github.workspace }}/aeonite-cts/cts
        run: npm run validate:cts-claims

      - name: Setup Python for reference tests
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Pure-Python reference tests and transport conformance
        working-directory: .
        env:
          AEONITE_CTS_ROOT: ${{ github.workspace }}/aeonite-cts/cts
          AES_ROOT: ${{ github.workspace }}/aes
        run: python3 -m unittest discover -s implementations/python/tests -p 'test_*.py'

      - name: Install native Python wheel build and typing tools
        run: python3 -m pip install maturin==1.15.0 mypy==1.19.1

      - name: Build native Python wheel
        working-directory: implementations/rust/crates/aeon-python
        run: >-
          python3 -m maturin build --release --locked --interpreter python3
          --out "${RUNNER_TEMP}/aeon-native-ordering-wheel"

      - name: Install and test native Python wheel
        working-directory: .
        run: |
          python3 -m pip install --force-reinstall --no-index --no-deps --only-binary=:all: "${RUNNER_TEMP}"/aeon-native-ordering-wheel/*.whl
          python3 -m unittest discover -s implementations/rust/crates/aeon-python/tests -p 'test_*.py'
          python3 -m mypy --strict implementations/rust/crates/aeon-python/tests/typing/canonical.py

      - name: Installed native Python reference-safe canonical API and TypeScript parity
        env:
          AEONITE_CTS_ROOT: ${{ github.workspace }}/aeonite-cts/cts
        run: node ../../scripts/test-canonical-reference-ordering.mjs python-native

      - name: CTS conformance (all lanes)
        env:
          AEONITE_CTS_ROOT: ${{ github.workspace }}/aeonite-cts/cts
        run: pnpm test:cts:all

      - name: Core escaped-path public CLI parity
        run: node ../../scripts/test-core-path-escaping.mjs

      - name: Canonical CTS 0.4 TypeScript default and explicit API
        env:
          AEONITE_CTS_ROOT: ${{ github.workspace }}/aeonite-cts/cts
        run: node ../../scripts/test-canonical-reference-ordering.mjs

      - name: Canonical CTS 0.4 Python default API and TypeScript parity
        env:
          AEONITE_CTS_ROOT: ${{ github.workspace }}/aeonite-cts/cts
        run: node ../../scripts/test-canonical-reference-ordering.mjs python

      - name: Committed WASM reference-safe canonical API and TypeScript parity
        env:
          AEONITE_CTS_ROOT: ${{ github.workspace }}/aeonite-cts/cts
        run: node ../../scripts/test-canonical-reference-ordering.mjs wasm

  rust-sdk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: implementations/rust

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout AES
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AltoPelago/aes
          ref: 84efced0d5a6e5fee50ebc69e04a861e2f567641
          path: aes

      - name: Link AES beside AEON checkout
        working-directory: .
        run: ln -s "${GITHUB_WORKSPACE}/aes" "${GITHUB_WORKSPACE}/../aes"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy

      - name: Rust SDK default surface
        run: cargo test --locked -p altopelago-aeon --no-default-features

      - name: Rust SDK SANSA integration
        run: cargo test --locked -p altopelago-aeon --all-features

      - name: Rust SDK lint
        run: cargo clippy --locked -p altopelago-aeon --all-targets --all-features -- -D warnings

  canonical-cts:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
      AEONITE_CTS_ROOT: ${{ github.workspace }}/aeonite-cts/cts
      AES_ROOT: ${{ github.workspace }}/aes

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout aeonite-cts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeonite-org/aeonite-cts
          ref: 3dcbcb7611657af8d3af83e93c4d12568a3f0ce1
          path: aeonite-cts

      - name: Checkout AES
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AltoPelago/aes
          ref: 84efced0d5a6e5fee50ebc69e04a861e2f567641
          path: aes

      - name: Link AES for the Rust workspace
        run: ln -s "${GITHUB_WORKSPACE}/aes" "${GITHUB_WORKSPACE}/../aes"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.4

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: implementations/typescript/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.93.1

      - name: Install TypeScript workspace dependencies
        working-directory: implementations/typescript
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build TypeScript workspace
        working-directory: implementations/typescript
        run: pnpm build

      - name: Build Rust CLI
        working-directory: implementations/rust
        run: cargo build -p aeon-cli

      - name: Canonical CTS lane
        run: bash ./scripts/canonical-cts.sh --mode all --brief

      - name: Canonical CTS 0.4 Rust default API and TypeScript parity
        run: node scripts/test-canonical-reference-ordering.mjs rust
