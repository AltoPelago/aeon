name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    defaults:
      run:
        working-directory: implementations/typescript

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout AES
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AltoPelago/aes
          ref: e9eb812d55cc69c5036c999c8bd2ea2585628666
          path: aes

      - name: Link AES for the Rust workspace
        run: ln -s "${GITHUB_WORKSPACE}/aes" "${GITHUB_WORKSPACE}/../aes"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: implementations/typescript/pnpm-lock.yaml

      - name: Version-tool tests
        working-directory: .
        run: npm run test:version

      - name: Version consistency
        working-directory: .
        run: npm run version:check

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Dependency graph checks
        run: pnpm depcheck

      - name: Unit tests
        run: pnpm -r --filter './packages/**' --filter './tools/**' --filter '!@altopelago/aeon-phase-fuzz' test

      - name: Phase fuzz (CI)
        run: pnpm test:fuzz

      - name: Stress tests
        run: pnpm test:stress

      - name: Checkout aeonite-cts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeonite-org/aeonite-cts
          ref: 3af0471d627fa91d6b88d079ec1294acbf337315
          path: aeonite-cts

      - name: CTS claim validation
        working-directory: .
        env:
          AEONITE_CTS_ROOT: ${{ github.workspace }}/aeonite-cts/cts
        run: npm run validate:cts-claims

      - name: CTS conformance (all lanes)
        env:
          AEONITE_CTS_ROOT: ${{ github.workspace }}/aeonite-cts/cts
        run: pnpm test:cts:all

  rust-sdk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: implementations/rust

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout AES
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AltoPelago/aes
          ref: e9eb812d55cc69c5036c999c8bd2ea2585628666
          path: aes

      - name: Link AES beside AEON checkout
        working-directory: .
        run: ln -s "${GITHUB_WORKSPACE}/aes" "${GITHUB_WORKSPACE}/../aes"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy

      - name: Rust SDK default surface
        run: cargo test --locked -p altopelago-aeon --no-default-features

      - name: Rust SDK SANSA integration
        run: cargo test --locked -p altopelago-aeon --all-features

      - name: Rust SDK lint
        run: cargo clippy --locked -p altopelago-aeon --all-targets --all-features -- -D warnings

  canonical-cts:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
      AEONITE_CTS_ROOT: ${{ github.workspace }}/aeonite-cts/cts
      AES_ROOT: ${{ github.workspace }}/aes

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout aeonite-cts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeonite-org/aeonite-cts
          ref: 3af0471d627fa91d6b88d079ec1294acbf337315
          path: aeonite-cts

      - name: Checkout AES
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AltoPelago/aes
          ref: e9eb812d55cc69c5036c999c8bd2ea2585628666
          path: aes

      - name: Link AES for the Rust workspace
        run: ln -s "${GITHUB_WORKSPACE}/aes" "${GITHUB_WORKSPACE}/../aes"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: implementations/typescript/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.93.1

      - name: Install TypeScript workspace dependencies
        working-directory: implementations/typescript
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build TypeScript workspace
        working-directory: implementations/typescript
        run: pnpm build

      - name: Build Rust CLI
        working-directory: implementations/rust
        run: cargo build -p aeon-cli

      - name: Canonical CTS lane
        run: bash ./scripts/canonical-cts.sh --mode all --brief
