name: npm Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm publish in dry-run mode
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/typescript

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
        with:
          version: 8.14.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: implementations/typescript/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Publish preflight
        run: pnpm publish:preflight

      - name: Publish packages to npm
        if: ${{ !inputs.dry_run }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: node ./tools/publish-npm-packages.mjs

      - name: Dry-run npm publish
        if: ${{ inputs.dry_run }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: node ./tools/publish-npm-packages.mjs --dry-run
