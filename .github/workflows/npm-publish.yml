name: npm Publish

on:
  push:
    tags:
      - "typescript/v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm publish in dry-run mode
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/typescript

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Require signed annotated release tag
        if: ${{ github.event_name == 'push' }}
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "${GITHUB_REF_NAME}")" = "tag"
          git cat-file tag "${GITHUB_REF_NAME}" | grep -Eq '^-+BEGIN (PGP|SSH) SIGNATURE-+$'

      - name: Verify tag commit is on main
        if: ${{ github.event_name == 'push' }}
        run: |
          TAG_COMMIT="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main

      - name: Verify release tag is signed
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          tag_type="$(printf '%s' "$tag_ref" | jq -r '.object.type')"
          tag_sha="$(printf '%s' "$tag_ref" | jq -r '.object.sha')"

          if [ "$tag_type" != "tag" ]; then
            echo "Release ref ${GITHUB_REF_NAME} is not an annotated tag."
            exit 1
          fi

          verification="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.verification')"
          verified="$(printf '%s' "$verification" | jq -r '.verified')"
          reason="$(printf '%s' "$verification" | jq -r '.reason')"

          if [ "$verified" != "true" ]; then
            echo "Release tag ${GITHUB_REF_NAME} is not verified. Reason: ${reason}"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 8.14.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: implementations/typescript/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Setup npm for trusted publishing
        run: npm install -g npm@11.14.1 --ignore-scripts --no-audit --fund=false

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Publish preflight
        run: pnpm publish:preflight

      - name: Publish packages to npm
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: node ./tools/publish-npm-packages.mjs

      - name: Dry-run npm publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: node ./tools/publish-npm-packages.mjs --dry-run --no-provenance
